<!doctype html>
<html lang="uk" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Бренд «Електрик на кремі» (assets/brand/brand.md у корені проєкту) */
      :root {
        --ground: #EEEAE2;
        --surface: #D9D4C9;
        --ink: #14161B;
        --blue: #2F47FF;
        --orange: #E2470F;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tool01" data-composition-id="tool01" data-composition-src="compositions/tool01.html"
        data-start="4" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tool02" data-composition-id="tool02" data-composition-src="compositions/tool02.html"
        data-start="10" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tool03" data-composition-id="tool03" data-composition-src="compositions/tool03.html"
        data-start="16" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tool04" data-composition-id="tool04" data-composition-src="compositions/tool04.html"
        data-start="22" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tool05" data-composition-id="tool05" data-composition-src="compositions/tool05.html"
        data-start="28" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tool06" data-composition-id="tool06" data-composition-src="compositions/tool06.html"
        data-start="34" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="40" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="progress" data-composition-id="progress" data-composition-src="compositions/progress.html"
        data-start="4" data-duration="36" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
