<!doctype html>
<html lang="uk" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Бренд «Електрик на кремі» (assets/brand/brand.md у корені проєкту) */
      :root {
        --ground: #EEEAE2;
        --surface: #D9D4C9;
        --ink: #14161B;
        --blue: #2F47FF;
        --orange: #E2470F;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sting" data-composition-id="sting" data-composition-src="compositions/sting.html"
        data-start="0" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="3" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="counter" data-composition-id="counter" data-composition-src="compositions/counter.html"
        data-start="6" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="lowerthird" data-composition-id="lowerthird" data-composition-src="compositions/lowerthird.html"
        data-start="9" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
