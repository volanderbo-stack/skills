<title>01 Один клік</title>
<style>
@font-face{font-family:'Manrope';src:url(data:font/ttf;base64,__MANROPE__) format('truetype');font-weight:200 800}
@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,__JBMONO__) format('truetype');font-weight:100 800}
html,body{background:#EEEAE2}
#stage{font-family:'Manrope',sans-serif;color:#14161B}
.lbl{white-space:nowrap;font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.rw{position:absolute;left:-380px;display:flex;align-items:center;gap:26px;white-space:nowrap;color:#EEEAE2;font-size:38px;font-weight:600}
.ring{position:relative;width:52px;height:52px;border-radius:50%;border:3px solid #3a3d46;box-sizing:border-box}
.ok{position:absolute;inset:-3px;border-radius:50%;background:#2F47FF;display:flex;align-items:center;justify-content:center}
</style>
<div data-slot="shape">
  <div class="L" id="Lopen"><div class="row" style="transform:translate(-50%,-50%);gap:18px;color:#EEEAE2;font-size:46px;font-weight:700"><span style="width:16px;height:16px;border-radius:50%;background:#2F47FF;display:inline-block"></span>Відкрити сайт</div></div>
  <div class="L" id="Lload">
    <div class="a lbl" style="left:-380px;top:56px;font-size:26px;color:#8A98FF">завантаження сторінки</div>
    <div class="rw" id="r0" style="top:132px"><div class="ring"><div class="ok" id="k0"></div></div>Адресу знайдено</div>
    <div class="rw" id="r1" style="top:226px"><div class="ring"><div class="ok" id="k1"></div></div>Захищене з'єднання</div>
    <div class="rw" id="r2" style="top:320px"><div class="ring"><div class="ok" id="k2"></div></div>Відповідь сервера</div>
    <div class="a" style="left:-380px;top:448px;width:760px;height:14px;border-radius:7px;background:#2a2d35"></div>
    <div class="a" id="bar" style="left:-380px;top:448px;height:14px;border-radius:7px;background:#2F47FF"></div>
    <div class="a lbl" id="pct" style="left:280px;top:488px;width:100px;text-align:right;font-size:26px;color:#EEEAE2">0%</div>
  </div>
  <div class="L" id="Ldone"><div class="row" style="transform:translate(-50%,-50%);gap:20px;color:#FFFFFF;font-size:50px;font-weight:700"><span id="icOk"></span>Сторінка готова</div></div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
['k0','k1','k2'].forEach(k=>$(k).innerHTML=M.icon('check',30,'#FFFFFF',3));
$('icOk').innerHTML=M.icon('check',48,'#FFFFFF',3.4);
const RIN=[1.6,2.25,2.9], CHK=[2.05,2.7,3.35];
M.scene({
  W:1920,H:1080,bg:'#EEEAE2',T:7.2,intro:0.1,
  SH:{open:{w:600,h:128,r:64,bg:'#14161B',cam:1.8}, load:{w:920,h:580,r:44,bg:'#14161B',cam:1.35}, done:{w:720,h:140,r:70,bg:'#2F47FF',cam:1.7}},
  start:'open', SEQ:[[1.3,'load'],[4.6,'done']],
  layers:[
    {el:'Lopen',tin:0.1,tout:1.3,o:{din:0.03}},
    {el:'Lload',tin:1.3,tout:4.6,anchor:'t',update:(t)=>{
      RIN.forEach((ti,i)=>{const v=M.vis(t,ti,null,{din:0,lin:0.18}); M.apply($('r'+i),v); const s=Math.max(0,M.S(t-CHK[i],17,0.62)); $('k'+i).style.transform=`scale(${s.toFixed(4)})`; $('k'+i).style.opacity=t<CHK[i]?0:1;});
      const p=M.clamp((t-1.5)/2.6), e=1-Math.pow(1-p,3);
      $('bar').style.width=(760*e).toFixed(1)+'px'; M.setText($('pct'),Math.round(e*100)+'%');
    }},
    {el:'Ldone',tin:4.6,tout:null},
  ],
  cursor:{size:44,clicks:[1.15],keys:[[0,560,330],[0.85,60,12],[1.25,60,12],[2.1,600,430],[7.2,600,430]]},
});
</script>
