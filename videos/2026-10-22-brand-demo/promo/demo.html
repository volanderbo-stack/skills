<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Motion Video — промо</title>
<style>
@font-face { font-family: 'Oswald'; src: url('../../../assets/brand/fonts/Oswald-Variable.ttf') format('truetype'); font-weight: 200 700; font-display: block; }
@font-face { font-family: 'Manrope'; src: url('../../../assets/brand/fonts/Manrope-Variable.ttf') format('truetype'); font-weight: 200 800; font-display: block; }
@font-face { font-family: 'JetBrains Mono'; src: url('../../../assets/brand/fonts/JetBrainsMono-Variable.ttf') format('truetype'); font-weight: 100 800; font-display: block; }
@font-face { font-family: 'Cormorant'; src: url('../../../assets/brand/fonts/Cormorant-Italic-Variable.ttf') format('truetype'); font-weight: 300 700; font-style: italic; font-display: block; }
html, body { margin: 0; background: #0b0b0b; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #14161B; transform-origin: 0 0; }
.layer { position: absolute; inset: 0; }
.H { font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase; white-space: nowrap; line-height: 1; }
.M { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-transform: uppercase; letter-spacing: .12em; white-space: nowrap; }
.S { font-family: 'Cormorant', serif; font-style: italic; font-weight: 700; white-space: nowrap; }
.mask { display: inline-block; overflow: hidden; vertical-align: top; }
.mask > span { display: inline-block; }
#grid { background-image: linear-gradient(rgba(238,234,226,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(238,234,226,.07) 1px, transparent 1px); background-size: 120px 120px; }
#hud { pointer-events: none; }
.br { position: absolute; width: 44px; height: 44px; }
#grain { position: absolute; inset: 0; width: 1920px; height: 1080px; mix-blend-mode: overlay; opacity: .16; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.22) 100%); }
#ctl { position: fixed; left: 12px; bottom: 12px; font: 13px system-ui; color: #ddd; display: flex; gap: 8px; align-items: center; }
#ctl input { width: 420px; }
</style>
</head>
<body>
<div id="stage">
  <!-- S1 spark -->
  <div class="layer" id="s1"><div class="layer" id="grid"></div>
    <div id="s1line" style="position:absolute;left:0;top:539px;height:3px;width:1920px;background:#2F47FF;transform-origin:50% 50%"></div>
    <div id="s1dot" style="position:absolute;left:942px;top:522px;width:36px;height:36px;border-radius:50%;background:#2F47FF"></div>
    <div id="s1lab" class="M" style="position:absolute;left:0;right:0;top:580px;text-align:center;font-size:26px;color:#EEEAE2">motion video / launch — 2026</div>
    <div id="s1flood" style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:#2F47FF;transform-origin:50% 50%"></div>
  </div>
  <!-- S2 brand slam -->
  <div class="layer" id="s2" style="background:#2F47FF">
    <div id="s2kick" class="M" style="position:absolute;left:0;right:0;top:250px;text-align:center;font-size:30px;color:#FFFFFF">представляємо — 2026</div>
    <div id="s2word" class="H" style="position:absolute;left:0;right:0;top:320px;text-align:center;font-size:300px;color:#FFFFFF"></div>
    <div id="s2line" class="S" style="position:absolute;left:0;right:0;top:660px;text-align:center;font-size:96px;color:#FFFFFF">відео з коду</div>
    <div id="s2dot" style="position:absolute;width:60px;height:60px;border-radius:50%;background:#EEEAE2"></div>
  </div>
  <!-- S3 kinetic triplet -->
  <div class="layer" id="s3a" style="background:#EEEAE2"><div id="w1" class="H" style="position:absolute;left:0;right:0;top:330px;text-align:center;font-size:400px;color:#14161B">Дизайн</div></div>
  <div class="layer" id="s3b" style="background:#14161B"><div id="w2pat" class="layer"></div><div id="w2" class="H" style="position:absolute;left:0;right:0;top:300px;text-align:center;font-size:460px;color:#2F47FF">Рух</div></div>
  <div class="layer" id="s3c" style="background:#2F47FF">
    <div id="vf" style="position:absolute;left:500px;top:250px;width:920px;height:600px"></div>
    <div id="w3" class="H" style="position:absolute;left:0;right:0;top:330px;text-align:center;font-size:400px;color:#FFFFFF">Код</div>
    <div id="vflab" class="M" style="position:absolute;left:500px;top:875px;font-size:26px;color:#FFFFFF">1920 × 1080</div>
  </div>
  <div id="wipe" style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:#EEEAE2;transform-origin:0 50%"></div>
  <!-- S4 product micro-moment -->
  <div class="layer" id="s4" style="background:#EEEAE2">
    <div id="cam4" class="layer" style="perspective:1800px">
      <div id="g2" style="position:absolute;left:600px;top:250px;width:720px;height:520px;border-radius:28px;background:#D9D4C9"></div>
      <div id="g1" style="position:absolute;left:600px;top:250px;width:720px;height:520px;border-radius:28px;background:#C9C3B6"></div>
      <div id="card" style="position:absolute;left:600px;top:250px;width:720px;height:520px;border-radius:28px;background:#14161B;color:#EEEAE2;padding:56px 60px;box-sizing:border-box">
        <div class="M" style="font-size:24px;color:#8A98FF">новий ролик</div>
        <div style="font-family:'Manrope';font-weight:700;font-size:52px;margin-top:14px">Промо 15 с</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:46px;font-family:'Manrope';font-weight:600;font-size:34px">
          <span>Бренд-кольори</span>
          <div id="tg" style="position:relative;width:112px;height:60px;border-radius:30px;background:#3a3d46"><div id="tgk" style="position:absolute;top:6px;left:6px;width:48px;height:48px;border-radius:50%;background:#EEEAE2"></div></div>
        </div>
        <div style="height:16px;border-radius:8px;background:#2a2d35;margin-top:52px;overflow:hidden"><div id="pb" style="height:16px;width:0;background:#2F47FF;border-radius:8px"></div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:34px">
          <div id="pct" class="M" style="font-size:30px;color:#EEEAE2">0%</div>
          <div id="btn" style="width:250px;height:84px;border-radius:42px;background:#2F47FF;display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:700;font-size:34px;color:#FFFFFF"><span id="btnt">Рендер</span></div>
        </div>
      </div>
    </div>
    <div id="toast" style="position:absolute;right:110px;top:150px;background:#FFFFFF;border-left:12px solid #2F47FF;padding:22px 36px;font-family:'Manrope';font-weight:700;font-size:34px;color:#14161B">Готово · 1920 × 1080</div>
    <svg id="cur" style="position:absolute;left:0;top:0;width:70px;height:96px" viewBox="0 0 40 56"><path d="M3 3 L3 41 L12.5 32 L19 47 L25.5 44.2 L19.2 29.8 L32 29.8 Z" fill="#E2470F" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>
    <div id="s4dot" style="position:absolute;left:930px;top:510px;width:60px;height:60px;border-radius:50%;background:#2F47FF"></div>
  </div>
  <!-- S5 end card -->
  <div class="layer" id="s5" style="background:#EEEAE2">
    <div id="ring" style="position:absolute;left:960px;top:540px;width:10px;height:10px;border-radius:50%;border:6px solid #2F47FF"></div>
    <div style="position:absolute;left:0;right:0;top:300px;text-align:center"><span class="mask"><span id="endw" class="H" style="font-size:230px;color:#14161B">Motion Video</span></span><span id="endmark" style="display:inline-block;width:56px;height:56px;background:#2F47FF;margin-left:20px;vertical-align:top;margin-top:150px"></span></div>
    <div id="endsub" class="S" style="position:absolute;left:0;right:0;top:580px;text-align:center;font-size:84px;color:#2F47FF">відео з коду</div>
    <div id="endrule" style="position:absolute;left:760px;top:720px;width:400px;height:3px;background:#14161B;transform-origin:50% 50%"></div>
    <div id="endurl" class="M" style="position:absolute;left:0;right:0;top:760px;text-align:center;font-size:34px;color:#14161B"></div>
  </div>
  <div id="vig"></div>
  <canvas id="grain" width="480" height="270"></canvas>
  <div id="hud" class="layer M" style="font-size:22px">
    <div class="br" id="b1" style="left:48px;top:48px;border-left:2px solid;border-top:2px solid"></div>
    <div class="br" id="b2" style="right:48px;top:48px;border-right:2px solid;border-top:2px solid"></div>
    <div class="br" id="b3" style="left:48px;bottom:48px;border-left:2px solid;border-bottom:2px solid"></div>
    <div class="br" id="b4" style="right:48px;bottom:48px;border-right:2px solid;border-bottom:2px solid"></div>
    <div id="hsc" style="position:absolute;right:110px;top:58px"></div>
    <div id="hcat" style="position:absolute;left:110px;bottom:58px"></div>
    <div style="position:absolute;right:110px;bottom:58px"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#E2470F;margin-right:12px;vertical-align:1px"></span><span id="htc"></span></div>
  </div>
</div>
<div id="ctl"><button id="pl">▶</button><input id="sc" type="range" min="0" max="12" step="0.001" value="0"><span id="tt">0.00</span></div>
<script>
/* BEAT SHEET — 128 BPM, beat = 0.46875 s
   0.000  S1 spark: dot pulses, stretches into a line + label          | kick enters, filtered riser
   1.400  line expands vertically into a blue flood                    | riser peaks
   1.875  S2 brand slam: MOTION VIDEO letters on 1/16 notes, kicker    | impact (flood), full beat
   2.800  serif line «відео з коду»; dot detaches from the last O     | blip
   3.300  dot grows into a cream flood                                 | whoosh
   3.750  S3 «ДИЗАЙН» ink on cream                                    | impact-lite + blip
   4.688  «РУХ» blue on ink, outline pattern                           | blip
   5.625  «КОД» white on blue in viewfinder brackets                  | blip
   6.380  cream bar wipe                                               | whoosh
   6.563  S4 product card: toggle on, cursor presses Рендер            | click
   7.500  progress 0→100 %, button → Готово, toast                    | ticks, ding
   8.900  card collapses into a blue dot                               | whoosh
   9.375  S5 end card: ring pulse → name + mark, serif line, URL types| impact, blips, ring-out
   12.00  end (hold 2 s+) */
const VIDEO = { w: 1920, h: 1080, duration: 12 };
window.VIDEO = VIDEO;
const B = 60 / 128;

function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
const easeIn = x => Math.pow(clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const $ = id => document.getElementById(id);
const show = (id, on) => { $(id).style.visibility = on ? 'visible' : 'hidden'; };

const T1 = 4 * B, T2 = 8 * B, T3a = 8 * B, T3b = 10 * B, T3c = 12 * B, T4 = 14 * B, T5 = 20 * B;

// S2 letters
const word = 'MOTION VIDEO';
$('s2word').innerHTML = [...word].map((c, i) => c === ' ' ? '<span style="display:inline-block;width:.25em"></span>' : `<span class="mask"><span id="L${i}">${c}</span></span>`).join('');
// S3 outline pattern
$('w2pat').innerHTML = Array.from({ length: 6 }, (_, r) => `<div class="H" style="position:absolute;left:${-200 + (r % 2) * 180}px;top:${-40 + r * 190}px;font-size:200px;color:transparent;-webkit-text-stroke:2px rgba(47,71,255,.35);letter-spacing:.05em">${'РУХ · '.repeat(8)}</div>`).join('');
// viewfinder corners
$('vf').innerHTML = [['left:0;top:0', 'border-left:6px solid #fff;border-top:6px solid #fff'], ['right:0;top:0', 'border-right:6px solid #fff;border-top:6px solid #fff'], ['left:0;bottom:0', 'border-left:6px solid #fff;border-bottom:6px solid #fff'], ['right:0;bottom:0', 'border-right:6px solid #fff;border-bottom:6px solid #fff']].map(([p, b]) => `<div style="position:absolute;${p};width:90px;height:90px;${b}"></div>`).join('');

// grain: 6 seeded tiles, cycled per frame
const gc = $('grain'), gx = gc.getContext('2d'), tiles = [];
for (let k = 0; k < 6; k++) { const r = rng(1000 + k), im = gx.createImageData(480, 270); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } tiles.push(im); }

function seek(t) {
  t = clamp(t, 0, VIDEO.duration - 1e-6);
  // ---- S1 spark
  const in1 = t < T1;
  show('s1', in1);
  if (in1) {
    const pulse = 1 + 0.25 * Math.sin(seg(t, 0.15, 0.75) * Math.PI * 2) * (1 - seg(t, 0.15, 0.75));
    const ds = spring(t - 0.05, 12, 0.7) * pulse;
    $('s1dot').style.transform = `scale(${ds * (1 - seg(t, 0.8, 0.95))})`;
    const lw = easeOut(seg(t, 0.8, 1.2));
    const wob = Math.sin(seg(t, 1.2, 1.4) * Math.PI * 3) * 4 * (1 - seg(t, 1.2, 1.4));
    $('s1line').style.transform = `scaleX(${lw}) translateY(${wob}px)`;
    $('s1lab').style.opacity = seg(t, 0.95, 1.15) * (1 - seg(t, 1.35, 1.45));
    $('s1flood').style.transform = `scaleY(${ease(seg(t, 1.4, T1))})`;
  }
  // ---- S2 brand slam
  const in2 = t >= T1 && t < T3a;
  show('s2', in2);
  if (in2) {
    const lt = t - T1;
    let n = 0;
    [...word].forEach((c, i) => { if (c === ' ') return; const e = $('L' + i); const d = lt - 0.08 - n * (B / 4) * 0.55; n++; e.style.transform = `translateY(${(1 - spring(d, 22, 0.68)) * 105}%)`; });
    $('s2kick').style.opacity = seg(lt, 0, 0.12);
    $('s2kick').style.filter = `blur(${8 * (1 - seg(lt, 0, 0.15))}px)`;
    $('s2line').style.opacity = seg(lt, 0.95, 1.1) * (1 - seg(lt, 1.35, 1.45));
    $('s2line').style.transform = `translateY(${(1 - easeOut(seg(lt, 0.95, 1.3))) * 30}px)`;
    // dot detaches from the word's right edge, then grows into the cream flood
    const dt = seg(lt, 1.1, 1.45), grow = easeIn(seg(lt, 1.45, T3a - T1));
    const x = lerp(1730, 930, ease(dt)), y = lerp(575, 510, ease(dt));
    const sc = spring(lt - 1.05, 18, 0.7) * (1 + grow * 45);
    Object.assign($('s2dot').style, { left: x + 'px', top: y + 'px', transform: `scale(${sc})` });
    $('s2word').style.opacity = 1 - seg(lt, 1.3, 1.45);
    $('s2kick').style.opacity *= 1 - seg(lt, 1.3, 1.45);
  }
  // ---- S3 kinetic triplet
  const word3 = (id, wid, a, b) => {
    const on = t >= a && t < b; show(id, on); if (!on) return;
    const lt = t - a, k = spring(lt, 20, 0.62);
    $(wid).style.transform = `translateX(${(1 - k) * -160}px)`;
    $(wid).style.filter = `blur(${12 * (1 - seg(lt, 0, 0.12))}px)`;
  };
  word3('s3a', 'w1', T3a, T3b);
  word3('s3b', 'w2', T3b, T3c);
  word3('s3c', 'w3', T3c, T4);
  if (t >= T3b && t < T3c) $('w2pat').style.transform = `translateX(${-(t - T3b) * 90}px)`;
  if (t >= T3c && t < T4) { const k = spring(t - T3c, 16, 0.75); $('vf').style.transform = `scale(${lerp(1.25, 1, k)})`; $('vf').style.opacity = k; $('vflab').style.opacity = seg(t, T3c + 0.2, T3c + 0.3); }
  // bar wipe into S4
  const wp = seg(t, T4 - 0.22, T4);
  show('wipe', t >= T4 - 0.22 && t < T4);
  $('wipe').style.transform = `scaleX(${ease(wp)})`;
  // ---- S4 product micro-moment
  const in4 = t >= T4 && t < T5;
  show('s4', in4);
  if (in4) {
    const lt = t - T4;
    const enter = spring(lt, 12, 0.8);
    const col = easeIn(seg(lt, 2.25, 2.75));
    const tilt = `rotateX(${lerp(12, 8, enter)}deg) rotateY(${lerp(-18, -10, enter)}deg)`;
    $('card').style.transform = `translateY(${(1 - enter) * 160}px) ${tilt} scale(${1 - col})`;
    $('g1').style.transform = `translate(${36 * enter}px, ${-28 * enter}px) ${tilt} scale(${1 - col})`;
    $('g2').style.transform = `translate(${72 * enter}px, ${-56 * enter}px) ${tilt} scale(${1 - col})`;
    $('g1').style.opacity = $('g2').style.opacity = 1 - col;
    // cursor: toggle at 0.55, button at 0.95
    const cp = [[0, 1500, 980], [0.5, 1150, 470], [0.62, 1150, 470], [0.9, 1080, 640], [1.05, 1080, 640], [1.6, 1500, 900]];
    let cx = cp[0][1], cy = cp[0][2];
    for (let i = 1; i < cp.length; i++) if (lt >= cp[i - 1][0]) { const k = ease(seg(lt, cp[i - 1][0], cp[i][0])); cx = lerp(cp[i - 1][1], cp[i][1], k); cy = lerp(cp[i - 1][2], cp[i][2], k); }
    const press = (lt > 0.52 && lt < 0.62) || (lt > 0.92 && lt < 1.02) ? 0.85 : 1;
    $('cur').style.transform = `translate(${cx}px, ${cy}px) scale(${press})`;
    $('cur').style.opacity = 1 - seg(lt, 1.5, 1.7);
    const tg = spring(lt - 0.56, 22, 0.75);
    $('tgk').style.transform = `translateX(${tg * 52}px)`;
    $('tg').style.background = tg > 0.5 ? '#2F47FF' : '#3a3d46';
    $('btn').style.transform = `scale(${lt > 0.92 && lt < 1.05 ? 0.94 : 1})`;
    const pr = ease(seg(lt, 1.0, 1.9)), done = Math.round(pr * 100) >= 100;
    $('pb').style.width = (pr * 100).toFixed(2) + '%';
    $('pct').textContent = Math.round(pr * 100) + '%';
    $('btnt').textContent = done ? 'Готово ✓' : 'Рендер';
    $('btn').style.background = done ? '#EEEAE2' : '#2F47FF';
    $('btn').style.color = done ? '#14161B' : '#FFFFFF';
    const ts = spring(lt - 1.95, 16, 0.75) * (1 - seg(lt, 2.4, 2.55));
    $('toast').style.transform = `translateX(${(1 - ts) * 520}px)`;
    $('toast').style.opacity = ts > 0.01 ? 1 : 0;
    $('s4dot').style.transform = `scale(${seg(lt, 2.55, 2.7) > 0 ? spring(lt - 2.55, 18, 0.7) : 0})`;
  }
  // ---- S5 end card
  const in5 = t >= T5;
  show('s5', in5);
  if (in5) {
    const lt = t - T5;
    const r = easeOut(seg(lt, 0, 0.6));
    $('ring').style.transform = `translate(-50%,-50%) scale(${1 + r * 60})`;
    $('ring').style.opacity = 1 - r;
    $('endw').style.transform = `translateY(${(1 - spring(lt - 0.2, 16, 0.78)) * 105}%)`;
    $('endmark').style.transform = `scale(${spring(lt - 0.55, 20, 0.6)})`;
    $('endsub').style.opacity = seg(lt, 0.75, 0.9);
    $('endsub').style.filter = `blur(${8 * (1 - seg(lt, 0.75, 0.9))}px)`;
    $('endrule').style.transform = `scaleX(${easeOut(seg(lt, 0.9, 1.3))})`;
    const url = 'ВАШ-САЙТ.UA', n = Math.floor(clamp((lt - 1.1) / 0.06, 0, url.length));
    $('endurl').textContent = url.slice(0, n) + (Math.floor(lt * 2.5) % 2 === 0 || n < url.length ? '▍' : ' ');
  }
  // ---- HUD
  const scene = t < T1 ? 1 : t < T3a ? 2 : t < T4 ? 3 : t < T5 ? 4 : 5;
  const cats = ['SPARK', 'BRAND', 'KINETIC TYPE', 'PRODUCT', 'END CARD'];
  const light = scene === 1 || scene === 2 || (t >= T3b && t < T4);
  $('hud').style.color = light ? 'rgba(238,234,226,.6)' : 'rgba(20,22,27,.5)';
  $('hsc').textContent = `SCENE 0${scene} / 05`;
  $('hcat').textContent = cats[scene - 1];
  const fr = Math.floor(t * 30);
  $('htc').textContent = `00:00:${String(Math.floor(t)).padStart(2, '0')}:${String(fr % 30).padStart(2, '0')}`;
  gx.putImageData(tiles[Math.floor(t * 24) % tiles.length], 0, 0);
}
window.seek = seek;

// ---- Sound: synthesised, seeded, scheduled from t = 0 on any (Offline)AudioContext
window.buildAudio = async function (ctx) {
  const out = ctx.createGain(); out.gain.value = 0.8; out.connect(ctx.destination);
  const music = ctx.createGain(); music.gain.value = 0.55; music.connect(out);
  const fx = ctx.createGain(); fx.gain.value = 0.9; fx.connect(out);
  const r = rng(77), nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = r() * 2 - 1;
  const noise = (t, dur, f0, f1, q, g, dest, type = 'bandpass') => {
    const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const a = ctx.createGain(); a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(g, t + Math.min(0.02, dur / 3)); a.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(a); a.connect(dest); s.start(t, r()); s.stop(t + dur + 0.05);
  };
  const tone = (t, dur, f0, f1, g, dest, type = 'sine', att = 0.004) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const a = ctx.createGain(); a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(g, t + att); a.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(a); a.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  };
  const kick = t => { tone(t, 0.32, 150, 42, 0.9, music); noise(t, 0.03, 3000, 1500, 1, 0.15, music); };
  const clap = t => { for (let k = 0; k < 3; k++) noise(t + k * 0.012, 0.12, 1600, 1200, 1.2, 0.35, music); };
  const hat = t => noise(t, 0.05, 9000, 8000, 0.8, 0.12, music, 'highpass');
  const nBeats = Math.floor(12 / B);
  for (let i = 0; i < nBeats; i++) {
    const t = i * B; if (t > 11.6) break;
    if (t >= T1 - 0.01) { kick(t); if (i % 2 === 1) clap(t); hat(t + B / 2); }
    else if (i >= 2) kick(t);
  }
  // sub bass following roots per bar (A, F, C, G)
  const roots = [55, 43.65, 65.41, 49];
  for (let bar = 0; bar < 6; bar++) {
    const t0 = T1 + bar * 4 * B; if (t0 >= 11.5) break;
    for (let k = 0; k < 8; k++) { const t = t0 + k * B / 2; if (t > 11.6) break; tone(t, B / 2 * 0.9, roots[bar % 4], roots[bar % 4] * 0.99, 0.28, music, 'sawtooth', 0.01); }
  }
  // riser into the slam and into the end card; impacts on floods
  noise(0.4, T1 - 0.4, 300, 6000, 2, 0.25, fx); noise(T5 - 1.2, 1.2, 400, 7000, 2, 0.2, fx);
  const impact = (t, g = 1) => { tone(t, 1.1, 90, 32, 0.9 * g, fx); noise(t, 0.35, 1800, 300, 0.7, 0.35 * g, fx, 'lowpass'); };
  impact(T1); impact(T3a, 0.5); impact(T5);
  // whooshes on carried transitions
  [[T1 + 1.45, 0.4], [T4 - 0.3, 0.3], [T4 + 2.25, 0.45]].forEach(([t, d]) => noise(t, d, 600, 4000, 1.5, 0.3, fx));
  // blips on words
  [T1 + 0.08, T3a, T3b, T3c, T5 + 0.2].forEach((t, i) => tone(t, 0.12, [880, 988, 1175, 1319, 1047][i], [880, 988, 1175, 1319, 1047][i], 0.18, fx, 'triangle'));
  // UI: clicks, progress ticks, ding
  [T4 + 0.56, T4 + 0.95].forEach(t => noise(t, 0.03, 4000, 3000, 2, 0.4, fx));
  for (let k = 0; k < 9; k++) tone(T4 + 1.0 + k * 0.1, 0.03, 2000, 2000, 0.05, fx, 'square');
  tone(T4 + 1.95, 0.9, 1568, 1568, 0.2, fx); tone(T4 + 1.95, 0.9, 2093, 2093, 0.1, fx);
  // typing on the URL, soft ring-out
  for (let k = 0; k < 11; k++) noise(T5 + 1.1 + k * 0.06, 0.02, 5000, 4000, 3, 0.12, fx);
  tone(T5 + 0.25, 2.3, 659, 659, 0.12, fx); tone(T5 + 0.25, 2.3, 988, 988, 0.06, fx);
};

// ---- preview mode
const RENDER = location.search.includes('render');
if (RENDER) { document.getElementById('ctl').remove(); seek(0); }
else {
  const st = $('stage'); const fit = () => { st.style.transform = `scale(${Math.min(innerWidth / 1920, (innerHeight - 50) / 1080)})`; }; fit(); addEventListener('resize', fit);
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * VIDEO.duration), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % VIDEO.duration); startAt = ac.currentTime; playing = true; }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; }
  function now() { return playing ? (offset + ac.currentTime - startAt) % VIDEO.duration : offset; }
  $('pl').onclick = () => playing ? pause() : play();
  $('sc').oninput = e => { const p = playing; pause(); offset = +e.target.value; if (p) play(); };
  (function loop() { const t = now(); seek(t); $('sc').value = t; $('tt').textContent = t.toFixed(2); requestAnimationFrame(loop); })();
}
</script>
